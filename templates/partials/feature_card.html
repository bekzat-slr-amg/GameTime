<div class="card flex items-center gap-4 !p-4">
  <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-lime/10 text-lime">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      {% if icon == "monitor" %}<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
      {% elif icon == "clock" %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
      {% elif icon == "globe" %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>
      {% elif icon == "shield" %}<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>
      {% elif icon == "headset" %}<path d="M4 14v-2a8 8 0 0116 0v2"/><rect x="3" y="14" width="4" height="6" rx="1"/><rect x="17" y="14" width="4" height="6" rx="1"/>
      {% endif %}
    </svg>
  </span>
  <div>
    <p class="font-bold">{{ title }}</p>
    <p class="text-sm text-muted">{{ text }}</p>
  </div>
</div>
