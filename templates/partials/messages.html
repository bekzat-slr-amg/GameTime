{% if messages %}
<div class="mx-auto max-w-7xl space-y-2 px-4 pt-4 sm:px-6" role="status">
  {% for message in messages %}
    {% if message.level_tag == "error" %}
      <div role="alert" class="rounded-xl border border-red-400/40 bg-red-400/10 px-4 py-3 text-sm font-semibold text-red-300">{{ message }}</div>
    {% else %}
      <div class="rounded-xl border border-lime/40 bg-lime/10 px-4 py-3 text-sm font-semibold text-lime">{{ message }}</div>
    {% endif %}
  {% endfor %}
</div>
{% endif %}
