<header class="sticky top-0 z-50 border-b border-line bg-bg/90 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6">
    <a href="{% url 'core:home' %}" class="text-xl font-extrabold tracking-tight">Game<span class="text-lime">Time</span></a>

    <nav class="hidden items-center gap-8 md:flex" aria-label="Основная навигация">
      {% include "partials/nav_links.html" with link_class="text-sm font-semibold text-muted transition-colors hover:text-lime" %}
    </nav>

    <div class="flex items-center gap-2">
      <a href="{% url 'core:home' %}#equipment" class="btn-primary">Забронировать</a>
      <button id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Открыть меню"
              class="btn-outline !px-3 md:hidden">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>

  <nav id="nav-menu" class="hidden border-t border-line bg-surface md:hidden" aria-label="Мобильная навигация">
    <div class="mx-auto flex max-w-7xl flex-col px-4 py-2 sm:px-6">
      {% include "partials/nav_links.html" with link_class="flex min-h-12 items-center text-base font-semibold text-ink" %}
    </div>
  </nav>
</header>
